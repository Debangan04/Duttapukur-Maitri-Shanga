<!DOCTYPE html>
<html lang="en">
<head>
    <head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upcoming Events | Duttapukur Maitri Sangha</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="style.css">

</head>
</head>

<body>

    <!-- HEADER -->
    <header class="cm-header">

        <img src="images/club-logo.png"
             alt="Duttapukur Maitri Sangha Logo"
             class="cm-logo">

        <div class="cm-brand">
            <h2>Duttapukur Maitri Sangha</h2>

            <p>
                UNITY • FRIENDSHIP • CULTURE • COMMUNITY SERVICE
            </p>
        </div>

    </header>


    <!-- NAVIGATION -->
    <nav class="cm-nav">

        <a href="index.html">Home</a>

        <a href="index.html#about">About</a>

        <a href="index.html#activities">Activities</a>

        <a href="events.html" class="active">Events</a>

        <a href="gallery.html">Gallery</a>

        <a href="committee.html">Committee</a>

        <a href="index.html#notices">Notices</a>

        <a href="index.html#contact">Contact</a>

    </nav>


    <!-- EVENTS -->
    <section class="events-page">

        <div class="events-heading">

            <span class="events-label">
                WHAT'S COMING
            </span>

            <h1>Upcoming Events</h1>

            <p>
                Stay updated with the latest events and activities
                of Duttapukur Maitri Sangha.
            </p>

        </div>


        <div class="add-event-area">

            <button id="addEventBtn"
                    class="add-event-btn">

                <i class="fa fa-plus"></i>

                Add Event

            </button>

        </div>


        <div id="eventsContainer"
             class="events-container">

        </div>


        <!-- BACK TO HOME -->

        <div class="back-home-wrapper">

            <a href="index.html"
               class="back-home-btn">

                <span>←</span>

                <span>Back to Home</span>

            </a>

        </div>

    </section>


    <!-- ADD EVENT POPUP -->

    <div id="eventModal"
         class="event-modal">

        <div class="event-modal-box">

            <button id="closeEventModal"
                    class="close-event-modal">

                ×

            </button>


            <h2>Add Upcoming Event</h2>


            <form id="eventForm">

                <input
                    type="text"
                    id="eventTitle"
                    placeholder="Event Name"
                    required
                >


                <input
                    type="date"
                    id="eventDate"
                    required
                >


                <input
                    type="time"
                    id="eventTime"
                >


                <input
                    type="text"
                    id="eventVenue"
                    placeholder="Venue"
                >


                <textarea
                    id="eventDescription"
                    placeholder="Event Description"
                    rows="4"
                ></textarea>


                <button
                    type="submit"
                    class="save-event-btn">

                    <i class="fa fa-check"></i>

                    Save Event

                </button>

            </form>

        </div>

    </div>


    <!-- EVENTS JAVASCRIPT -->

    <script src="events.js"></script>

</body>
</html>
