<section class="full-gallery">

    <div class="section-title">
        <span>OUR MEMORIES</span>
        <h2>Photo Gallery</h2>
        <p>Moments from Duttapukur Maitri Sangha</p>
    </div>


    <div class="photo-grid" id="photoGrid">
    <p>Loading photos...</p>
</div>

<script>
const API_KEY = "AIzaSyDf6OTMw-EixTb97Nr_Udjhm-x-DCJqy14";
const FOLDER_ID = "1eJbvIcny-UfhRuZax-FXg6SZM2bj-uX1";

const photoGrid = document.getElementById("photoGrid");

async function loadGallery() {
    const query =
        `'${FOLDER_ID}' in parents and trashed = false and mimeType contains 'image/'`;

    const url =
        `https://www.googleapis.com/drive/v3/files` +
        `?q=${encodeURIComponent(query)}` +
        `&fields=files(id,name,mimeType,thumbnailLink)` +
        `&pageSize=100` +
        `&key=${API_KEY}`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || "Google Drive API error");
        }

        photoGrid.innerHTML = "";

        if (!data.files || data.files.length === 0) {
            photoGrid.innerHTML = "<p>No photos found.</p>";
            return;
        }

        data.files.forEach(file => {
            const card = document.createElement("div");
            card.className = "photo-card";

            card.innerHTML = `
                <img
                    src="${file.thumbnailLink}"
                    alt="${file.name}"
                    loading="lazy"
                >
            `;

            photoGrid.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        photoGrid.innerHTML =
            "<p>Gallery could not be loaded.</p>";
    }
}

loadGallery();
</script>
